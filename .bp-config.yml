# Code Standards config — React Native / Expo profile
# Dropped onto a new RN app by `standards init --template react-native`.
# Tuned for mobile: no web bundle/load targets, accessibility on, E2E lives in
# the shared guinea-pig repo (not in-repo).
version: "1.0.0"

project:
  type: "react-native"

standards:
  code:
    enforceComments: true
    maxFunctionLines: 60
    # ASPIRATIONAL — nothing enforces this. Both `npm test` and ci.yml pass
    # --no-coverage, so the number is never measured. It is the target to aim
    # at when adding tests, not a gate that exists; making it real means
    # dropping --no-coverage in CI and accepting the runtime cost.
    testCoverage: 70          # RN apps: unit-test logic, not pixels

  security:                   # the crown jewels — keep all on
    scanSecrets: true
    vulnerabilityScan: true
    dependencyCheck: true

  performance:
    # No web bundleSize/loadTime here — APK/AAB size is checked at build time,
    # not by a static scan. Keep the code-level perf checks only.
    unusedDependencies: true
    nestedLoops: true

  accessibility:              # WCAG 2.1 AA matters on mobile
    enabled: true
    level: "AA"

# E2E is NOT in-repo for Tessellate apps — it runs in guinea-pig.
testing:
  e2e:
    inRepo: false
    runner: "guinea-pig"

automation:
  github:
    autoPR: false             # handled by the agent + branch rules / native auto-merge
    autoMerge: false
  hooks:
    # What is actually implemented as of 2026-08-13: a pre-PUSH hook
    # (.husky/pre-push, tsc + jest), installed by `sh .husky/install.sh`.
    # These two flags claimed pre-commit and commit-msg hooks that no file
    # ever implemented — declared at scaffold time, never built. Set to what
    # is true rather than quietly "fixed": commit-time checks on a suite this
    # slow would make every commit painful, and the push gate catches the same
    # breakage before anything leaves the machine.
    preCommit: false
    commitMsg: false
    prePush: true

customRules:
  naming:
    functions: "camelCase"
    variables: "camelCase"
    constants: "UPPER_CASE"
  project:
    requireReadme: true
    requireLicense: true

reporting:
  format: "json"
  includeMetrics: true
