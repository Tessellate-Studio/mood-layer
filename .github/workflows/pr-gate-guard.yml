# ---------------------------------------------------------------------------
# PR gate guard — makes a MISSING gate visible.
#
# THE FAILURE IT CATCHES. A `pull_request` workflow runs against the MERGE ref
# (`refs/pull/N/merge`). When a PR conflicts with its base, GitHub cannot
# compute that ref, so it runs NOTHING of that class — silently, with no run
# record whose absence anyone could notice. First measured on alate PR #645
# (2026-09-01): the PR sat open with no CI at all, and the only check on it
# was `auto-merge / skipping`. `pull_request_target` runs against the BASE
# branch instead, which is why it is the mechanism this guard is built on.
#
# WHY THE GATE CANNOT GUARD ITSELF. Any check added to ci.yml, or any new
# `pull_request` workflow, shares the exact blind spot it would be covering: a
# conflicted PR is precisely the case where it would not run. The guard has to
# live outside that event class. That is the whole design.
#
# WHY IT STILL EARNS ITS PLACE ON A PUBLIC REPO. This repo is public, so
# unlike alate and loom it CAN configure required status checks — and once it
# does, a conflicted PR is blocked by the server rather than merely
# unverified. Two reasons this is still worth having:
#   1. Required checks are NOT configured today (verified 2026-09-07: the
#      branch-protection API returns required_status_checks: null). Until they
#      are, merge-on-green here is discipline, and "nothing red" and "nothing
#      tested" look identical.
#   2. Even with required checks on, GitHub blocks the merge without ever
#      saying WHY the checks are missing rather than failing. The label and
#      comment are the explanation, and `gh pr list --label gate-blocked`
#      makes the state queryable by the agents that sweep this repo.
#
# SECURITY — the load-bearing constraint of `pull_request_target`. It runs
# with a WRITE token in the base repo's context, so checking out or executing
# PR-authored code under it is the well-known privilege-escalation path, and
# that matters more here than on the private repos: this repo is PUBLIC, so
# anyone can open a PR against it. This workflow therefore does NO checkout
# and runs NO repo code: API calls only, and it never interpolates
# PR-controlled text into a shell. Keep it that way.
#
# COST. `ubuntu-latest` is correct ONLY while this repo is public: Actions
# minutes are free on public repositories, so the 2,000-minute pool that forces
# alate and loom onto self-hosted does not apply. That reasoning expires the
# moment mood-layer goes private, which is planned.
#
# This originally ran a `*/30` sweep as well, on the reasoning that "a handful
# of API calls" is cheap. That was wrong about the billing model: GitHub
# charges per RUN, rounded UP to the minute, so 48 cheap runs a day is ~1,440
# minutes a month — three quarters of the free pool from this file alone. The
# schedule was removed on 2026-09-09 under a standing directive that recurring
# work belongs on the self-hosted runners. See the `on:` block for what that
# costs in coverage and when to re-add it.
# ---------------------------------------------------------------------------

name: PR gate guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    # Kept. It catches the case no event can: a PR that opened clean, went
    # green, then conflicted when master moved under it — nothing fires on the
    # PR then, so the stale green check just sits there looking like a pass.
    #
    # This is free while the repo is public, and the `runs-on` below moves it to
    # the self-hosted runners by itself the moment the repo goes private, so it
    # never starts drawing on the shared pool.
    #
    # `*/30` is a CEILING, not a rate. GitHub throttles scheduled workflows
    # hard: measured 2026-09-09, this fired ONCE in 24h, not 48 times. Do not
    # re-derive a cost estimate from the expression — measure it.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Where to run. Pick ubuntu-latest if the self-hosted runner is not picking jobs up.'
        type: choice
        required: true
        default: self-hosted
        options:
          - self-hosted
          - ubuntu-latest

# No `contents:` at all — nothing here reads or writes the repo tree.
# Comments and labels on a PR both go through the issues API.
permissions:
  pull-requests: write
  issues: write

concurrency:
  # Per PR on the event path, one shared slot for the sweep: two overlapping
  # sweeps would race on "have I already commented?".
  group: pr-gate-guard-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  guard:
    # HOSTED WHILE PUBLIC, SELF-HOSTED ONCE PRIVATE — decided per run, so the
    # move happens on its own at the visibility flip and nobody has to remember.
    # Actions minutes are free on public repos and billed on private ones, so
    # this is exactly where the org's "recurring work goes on the self-hosted
    # runners" directive (2026-09-09) starts to bite.
    #
    # Fork safety, since this fires on `pull_request_target` and would therefore
    # put a PR-triggered job on shared infrastructure once private. Four things
    # stack up, and the first is the one that actually does the work:
    #   1. The repo's fork-PR approval policy is `all_external_contributors`
    #      (verified 2026-09-09), so no outside contributor's PR runs anything
    #      until a maintainer clicks Approve. A fork cannot silently take a
    #      runner.
    #   2. `pull_request_target` executes the BASE branch's copy of this file.
    #      A fork cannot change what runs here by editing its own copy.
    #   3. This job does NO checkout and runs NO repo code — API calls only.
    #      There is no PR-authored code for a runner to execute. KEEP IT THAT
    #      WAY: adding `actions/checkout` with `ref: github.event.pull_request.head.sha`
    #      would turn every point above into a formality.
    #   4. Once the repo is private, "fork PR from an outside contributor" stops
    #      being a meaningful category anyway.
    #
    # The dispatch hatch is not decoration: a label with no runner behind it
    # does not fail, it QUEUES FOR EVER — the silently-absent guard this whole
    # workflow exists to prevent. If a scheduled run stops appearing after the
    # flip, dispatch at `ubuntu-latest` to confirm the logic still works, then
    # fix the runner group.
    #
    # Fallback direction is deliberate: if `github.event.repository.private` is
    # ever absent from a payload, this resolves to `ubuntu-latest` — the guard
    # keeps running and costs a little, rather than queueing and going silent.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'ubuntu-latest') && fromJSON('["ubuntu-latest"]') || (github.event.repository.private && fromJSON('["self-hosted","linux","ops"]') || fromJSON('["ubuntu-latest"]')) }}
    timeout-minutes: 10

    steps:
      - name: Flag open PRs whose gate cannot run
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL  = 'gate-blocked';
            const MARKER = '<!-- pr-gate-guard -->';
            const { owner, repo } = context.repo;

            // On an event, look only at the PR that fired. On a sweep, look at
            // every open PR — a PR goes conflicted when MASTER moves, which
            // fires no event on the PR itself.
            let numbers;
            if (context.eventName === 'pull_request_target') {
              numbers = [context.payload.pull_request.number];
            } else {
              const open = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100,
              });
              numbers = open.map((p) => p.number);
            }
            core.info(`Examining ${numbers.length} PR(s): ${numbers.join(', ') || '(none)'}`);

            // `mergeable` is computed ASYNCHRONOUSLY. A fresh PR answers null
            // ("not computed yet"), which is not the same as false and must
            // never be treated as one — flagging on null would label every new
            // PR. Poll briefly, then give up and say so rather than guess.
            const resolveMergeable = async (number) => {
              for (let attempt = 0; attempt < 6; attempt++) {
                const { data } = await github.rest.pulls.get({ owner, repo, pull_number: number });
                if (data.mergeable !== null) return data;
                await new Promise((r) => setTimeout(r, 5000));
              }
              return null;
            };

            let flagged = 0;
            let cleared = 0;

            for (const number of numbers) {
              const pr = await resolveMergeable(number);
              if (!pr) {
                core.warning(`#${number}: GitHub did not finish computing mergeable in time — left alone.`);
                continue;
              }
              if (pr.draft) continue;

              const labels = pr.labels.map((l) => l.name);
              const alreadyFlagged = labels.includes(LABEL);

              // mergeable === false is the ONLY condition flagged here, and it
              // is exact rather than heuristic: it is the same state that stops
              // GitHub building the merge ref. Deliberately NOT inferring "no
              // gate ran" from an empty run list — a docs-only PR legitimately
              // has no run, and duplicating that path logic here would
              // false-positive on every docs PR.
              if (pr.mergeable === false) {
                if (alreadyFlagged) {
                  core.info(`#${number}: still conflicted, already flagged.`);
                  continue;
                }
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: number, labels: [LABEL],
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: number,
                  body: [
                    MARKER,
                    '### ⚠️ This PR conflicts with its base — so its CI gate cannot run',
                    '',
                    'A `pull_request` workflow runs against the merge ref (`refs/pull/' + number + '/merge`).',
                    'GitHub cannot build that ref while the PR conflicts, so **every** `pull_request` workflow',
                    'is skipped — CI, lint and the secret scan alike. No run record is created, so the absence',
                    'never shows up as a failure.',
                    '',
                    '**An empty check list here does not mean "nothing is wrong". It means nothing was tested.**',
                    '',
                    'Resolve the conflict (merge or rebase `master` into the branch) and push. The gate runs on',
                    'the resulting `synchronize` event, and this label clears itself on the next pass.',
                    '',
                    '<sub>Posted by `.github/workflows/pr-gate-guard.yml`.</sub>',
                  ].join('\n'),
                });
                flagged++;
                core.warning(`#${number}: conflicted — gate cannot run. Labelled '${LABEL}'.`);
              } else if (alreadyFlagged) {
                // Recovered. Drop the label so a LATER conflict is reported as
                // a new episode rather than swallowed as "already known". The
                // comment stays: it is the record of what happened.
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: number, name: LABEL,
                }).catch((e) => core.info(`#${number}: label already gone (${e.status}).`));
                cleared++;
                core.info(`#${number}: conflict resolved — '${LABEL}' removed.`);
              }
            }

            core.info(`Done. flagged=${flagged} cleared=${cleared}`);
