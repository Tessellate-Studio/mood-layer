# Watch — Mood Layer circle relay — SUBJECT: the circle relay — a Supabase edge function living in ALATE's project, not this repo's. Watches for that project pausing. Application health, NOT CI health.
# ---------------------------------------------------------------------------
# Ops watchdog — the only runtime signal this repo has that does not depend on
# a human noticing something.
#
# WHAT IT CHECKS, hourly:
#   1. The circle relay is alive. POST an unknown action to the Supabase edge
#      function and expect its dispatcher to answer `{"error":"unknown
#      action"}`. Deliberately writes NOTHING: no invite, no message, no
#      pairing — the probe never reaches a data path, needs no token, and
#      cannot leave rows behind.
#
#      This matters more here than the endpoint count suggests. The relay is
#      this app's ONLY server, it lives in ALATE's Supabase project (chosen
#      2026-07-18 because a free-tier project pauses after ~1 week idle and
#      alate's traffic keeps it awake — BACKLOG), and nothing in this repo has
#      ever watched it. If alate goes quiet and the project pauses, circle
#      delivery stops silently: sends fail into a catch, and the only person
#      who finds out is a user whose weekly share never arrived.
#
# WHY A `schedule:` IS ALLOWED HERE. relock.yml's header records the
# 2026-07-18 removal of its weekly cron under forge's "CI spend" standard,
# after the org burned its 2,000 included Actions minutes. That standard binds
# PRIVATE repos: GitHub bills Actions minutes only for private repositories,
# and this repo is PUBLIC (the private flip was parked — PR #53,
# docs/user-actions-tracker.md).
#
# That earlier note told a future reader to DELETE this workflow, or disable it
# via OPS_WATCHDOG_ENABLED, if the repo went private. Superseded on 2026-09-09:
# the job now picks its runner from the repo's OWN VISIBILITY, so at the flip it
# moves itself onto the org's self-hosted runners, which cost nothing from the
# pool. The flip no longer forces a choice between paying for the watchdog and
# going blind — and nobody has to remember to make the change. Recurring work
# belongs on those runners: standing user directive, same date. Keep the
# schedule.
#
# On measured volume, so nobody re-derives a scary number from the cron
# expression: `17 * * * *` reads as 24 runs/day, but GitHub heavily throttles
# scheduled workflows and the observed rate was 6 runs in 24h (2026-09-09).
# The cron is a ceiling, not a rate.
#
# Hourly, not every 10 minutes: the failure this watches for (a paused
# Supabase project) takes days to develop and hours to matter. ~24 runs/day of
# a few seconds each.
#
# ALERTING: opens ONE `ops-alert` issue and does not duplicate while it is
# open — the same shape as build-android-apk.yml's alert-on-failure job, which
# exists because a deploy pipeline once failed silently for 18 days. The daily
# crash-monitor task triages open issues in this repo, so an ops-alert lands
# in a loop that already runs.
#
# INERT UNTIL ENABLED: the scheduled job is skipped (and occupies no runner)
# until repo variable OPS_WATCHDOG_ENABLED == 'true'. A manual dispatch always
# runs — that is how it gets verified before being switched on.
# ---------------------------------------------------------------------------
name: Watch — Mood Layer circle relay

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Where to run. Pick ubuntu-latest if the self-hosted runner is not picking jobs up.'
        type: choice
        required: true
        default: self-hosted
        options:
          - self-hosted
          - ubuntu-latest

permissions:
  issues: write

concurrency:
  group: ops-watchdog
  cancel-in-progress: false

jobs:
  probe:
    if: vars.OPS_WATCHDOG_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    # HOSTED WHILE PUBLIC, SELF-HOSTED ONCE PRIVATE — decided per run, so the
    # move happens on its own at the visibility flip and nobody has to remember.
    # Actions minutes are free on public repos and billed on private ones;
    # recurring work in this org belongs on the self-hosted runners, which cost
    # nothing either way (standing user directive, 2026-09-09).
    #
    # There is no fork exposure to weigh here at all, unlike pr-gate-guard.yml:
    # this workflow has no `pull_request` or `pull_request_target` trigger, so
    # no PR — fork or otherwise — can cause it to run. Schedule and manual
    # dispatch only.
    #
    # The dispatch hatch is not decoration: a label with no runner behind it
    # does not fail, it QUEUES FOR EVER, and a watchdog that silently stops
    # watching is worse than no watchdog. If scheduled runs stop appearing after
    # the flip, dispatch at `ubuntu-latest` to confirm the probe still works,
    # then fix the runner group.
    #
    # Fallback direction is deliberate: if `github.event.repository.private` is
    # ever absent from a payload, this resolves to `ubuntu-latest` — the probe
    # keeps running and costs a little, rather than queueing and going silent.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'ubuntu-latest') && fromJSON('["ubuntu-latest"]') || (github.event.repository.private && fromJSON('["self-hosted","linux","ops"]') || fromJSON('["ubuntu-latest"]')) }}
    timeout-minutes: 5
    steps:
      - name: Probe the circle relay and alert on failure
        uses: actions/github-script@v7
        with:
          script: |
            // Same URL the app ships (src/services/circleRelay.ts). Not a
            // secret — auth is the per-pairing bearer token, not the address.
            const RELAY = 'https://ancuwmmivgdvommzigwv.supabase.co/functions/v1/moodlayer-relay';
            const failures = [];

            try {
              const res = await fetch(RELAY, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // An action the dispatcher does not know. Verified 2026-08-13:
                // answers 400 {"error":"unknown action"} and touches no table.
                body: JSON.stringify({ action: '__watchdog_probe__' }),
              });
              const text = await res.text();
              if (!text.includes('unknown action')) {
                failures.push(
                  `relay: expected the dispatcher's "unknown action" reply, got HTTP ${res.status} — ${text.slice(0, 200)}`
                );
              }
            } catch (e) {
              failures.push(`relay: unreachable — ${e.message}`);
            }

            if (failures.length === 0) {
              core.info('OK — circle relay alive (dispatcher answered, no data written)');
              return;
            }

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ops-alert',
              per_page: 1,
            });
            const detail = failures.map((f) => `- ${f}`).join('\n');
            if (open.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Watch — Mood Layer: circle relay probe failing',
                labels: ['ops-alert'],
                body:
                  `The scheduled relay probe failed.\n\n${detail}\n\n` +
                  `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                  `First thing to check: is the **alate** Supabase project paused? This ` +
                  `function lives there (BACKLOG — free-tier projects pause after ~1 week ` +
                  `idle). Circle delivery is down for every user while this is red. ` +
                  `Close the issue once the probe is green; the watchdog opens a fresh one ` +
                  `on the next failure.`,
              });
              core.info('Opened a new ops-alert issue.');
            } else {
              core.info(`ops-alert issue #${open[0].number} already open — not duplicating.`);
            }
            core.setFailed(`Probe failures:\n${detail}`);
