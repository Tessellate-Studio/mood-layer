name: Build Android APK

# Cloud builds ONLY (2026-07-14, explicit user rule): native compilation
# (Gradle/CMake) must never run on the user's laptop — local builds were
# consuming the machine to breaking point, and Windows' 260-char path
# limit breaks local CMake object paths anyway. This workflow is the only
# sanctioned way to produce a Mood Layer APK:
#
#   gh workflow run build-android-apk.yml --ref master
#   gh run download <run-id> --name mood-layer-apk
#   adb install -r app-release.apk
#
# workflow_dispatch only — same Actions-minutes reasoning as badige's
# 2026-07-13 CI-cost fix: a full Android build on every merge is spend
# nobody is necessarily waiting on. A manual dispatch is a deliberate
# "build it now".
#
# Signing: debug keystore (deliberate for now). The app is sideload-only —
# not on Play Store — and a stable, committed-nowhere debug key means any
# machine's dispatch produces install-compatible builds. Replace with a
# real keystore secret (per alate's build-android-apk.yml + anti-pattern
# #19: restore from secret store, never echo, fail closed) before any
# store release.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # First real run (29563745748, 2026-07-17) proved a cold RN 0.83 release
    # build does NOT fit in 45 min on a hosted runner — Gradle alone ran 44
    # min before the timeout cancelled it. 90 gives cold builds room; the
    # Gradle cache + single-ABI build below pull warm builds far under it.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Caches Gradle wrapper + dependency/build caches between runs so only
      # the first build after a dependency change pays the cold price.
      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --no-install

      # arm64-v8a ONLY: this APK is sideloaded onto the user's own phone
      # (arm64, like every Android released since ~2017) — compiling the
      # other three ABIs quadruples native build time for nothing. Remove
      # the -P flag if this ever needs to ship to a store or an x86 emulator.
      - name: Build release APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mood-layer-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  # A red run in the Actions tab is silent (see alate's 18-day dead-deploy
  # precedent) — open an issue so a failure actually reaches a human.
  alert-on-failure:
    needs: [build]
    if: failure() || needs.build.result == 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open a ci-failure issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `APK build failed: run ${context.runId}`,
              body: `The Android APK build failed or was cancelled.\n\nRun: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure'],
            });
