# Advisory code-inspection gate (shared reusable workflow from the forge
# platform repo — code-standards merged into forge 2026-07-17).
# fail_on_error stays false until the config is proven on this app; the app's
# own tsc + jest gate is the blocking check (run locally pre-commit).
name: code-inspection

on:
  pull_request:

jobs:
  inspect:
    uses: Tessellate-Studio/forge/.github/workflows/code-inspection.yml@master
    with:
      fail_on_error: false
